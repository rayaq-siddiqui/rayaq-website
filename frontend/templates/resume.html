<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rayaq Siddiqui — Resume</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='resume.css') }}" />
</head>
<body class="site">
  <main class="resume">
    <a class="back-link" href="{{ url_for('home') }}">&larr; Home</a>

    <header class="resume-header">
      <h1>Rayaq Siddiqui</h1>
      <p class="resume-headline">{{ headline }}</p>
      <p class="resume-location">{{ location }}</p>
      <div class="resume-links">
        <a href="mailto:{{ contact.email }}">{{ contact.email }}</a>
        <a href="{{ contact.linkedin }}" target="_blank" rel="noopener">LinkedIn</a>
        <a href="{{ contact.github }}" target="_blank" rel="noopener">GitHub</a>
      </div>
      <p class="resume-summary">{{ summary }}</p>
    </header>

    {% include "_resume.html" %}
  </main>
</body>
</html>
