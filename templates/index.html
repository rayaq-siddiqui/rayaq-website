<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rayaq</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <main>
    <h1>Rayaq</h1>
    <div class="cities">
      {% for city in cities %}
      <div class="city-card">
        <h2>{{ city.name }}</h2>
        {% if city.temperature_c is not none %}
        <p class="temp">{{ city.temperature_c }}&deg;C</p>
        <p class="desc">{{ city.description }}</p>
        <p class="wind">Wind: {{ city.windspeed_kmh }} km/h</p>
        {% else %}
        <p class="desc">Weather unavailable</p>
        {% endif %}
      </div>
      {% endfor %}
    </div>
  </main>
</body>
</html>
